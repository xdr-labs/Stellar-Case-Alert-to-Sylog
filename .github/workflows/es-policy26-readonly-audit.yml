name: Engineering System policy 26 isolated adoption qualification

on:
  pull_request:
    paths:
      - ".github/workflows/es-policy26-readonly-audit.yml"
      - "AGENTS.md"
      - ".engineering/**"
      - "tools/**"
      - ".github/workflows/engineering-system.yml"

permissions:
  contents: read

jobs:
  managed-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact consumer candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: target
      - name: Checkout canonical Engineering System immutable merged main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: datarelay-labs/engineering-system
          ref: 141bd3fcad6f95d3a382e91fdc351ae0a54819a4
          fetch-depth: 0
          persist-credentials: false
          path: canonical
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify SHA and install pinned canonical dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "141bd3fcad6f95d3a382e91fdc351ae0a54819a4"
          git -C canonical cat-file -e "2c73cdd52b98db4143b379730ee0c69d284f80e8:tools/user_acceptance_contract.py"
          test "$(git -C target rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m pip install --disable-pip-version-check -r canonical/.engineering/requirements-engineering-system.txt
      - name: Audit managed upgrade without target source writes
        shell: bash
        run: |
          set -euo pipefail
          before="$(git -C target status --porcelain)"
          test -z "$before"
          python3 -B canonical/tools/upgrade-adoption.py \
            --root target \
            --audit \
            --baseline-sha 141bd3fcad6f95d3a382e91fdc351ae0a54819a4
          after="$(git -C target status --porcelain)"
          test -z "$after"
          echo "SOURCE_UNMODIFIED=YES"
          echo "TARGET_HEAD=$(git -C target rev-parse HEAD)"
          echo "CANONICAL_HEAD=$(git -C canonical rev-parse HEAD)"

      - name: Apply canonical managed upgrade only inside disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/es-policy-upgrade-sandbox"
          cp -a target "$scratch"
          test "$(git -C "$scratch" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -B canonical/tools/upgrade-adoption.py \
            --root "$scratch" \
            --apply \
            --baseline-sha 141bd3fcad6f95d3a382e91fdc351ae0a54819a4
          git -C "$scratch" diff --check
          git -C "$scratch" diff --stat
          echo "UPGRADED_FILES_BEGIN"
          git -C "$scratch" status --short
          echo "UPGRADED_FILES_END"
          python3 -B canonical/tools/check-adoption.py \
            --root "$scratch" --require-current-policy
          test -z "$(git -C target status --porcelain)"
          echo "PRODUCTION_SOURCE_UNMODIFIED=YES"
      - name: Emit strictly allowlisted sandbox-only managed patch for review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          target = Path("target")
          scratch = Path(os.environ["RUNNER_TEMP"]) / "es-policy-upgrade-sandbox"
          expected = {
              ".engineering/governance-migration.yaml",
              ".engineering/project.yaml",
              ".github/workflows/engineering-system.yml",
              "schemas/user-acceptance-evidence.schema.json",
              "tools/coordinator.py",
              "tools/coordinator_watch_effects.py",
              "tools/governance_floor.py",
              "tools/handoff_contract.py",
              "tools/terminal_completion_notify.py",
              "tools/user_acceptance_contract.py",
              "tools/work_admission.py",
          }
          def git(path, *args):
              return subprocess.check_output(
                  ["git", "-C", str(path), *args], text=True).strip()
          head = git(target, "rev-parse", "HEAD")
          assert head == git(scratch, "rev-parse", "HEAD")
          changed = set(git(scratch, "diff", "--name-only").splitlines())
          assert changed == expected, (changed - expected, expected - changed)
          tree = git(target, "rev-parse", "HEAD^{tree}")
          print("MANAGED_PATCH_BEGIN " + head + " " + tree)
          for rel in sorted(changed):
              path = scratch / rel
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert 0 < len(raw) < 150000
              raw.decode("utf-8")
              print("MANAGED_FILE " + rel + " " + hashlib.sha256(raw).hexdigest()
                    + " " + base64.b64encode(raw).decode("ascii"))
          print("MANAGED_PATCH_END")
          PY
