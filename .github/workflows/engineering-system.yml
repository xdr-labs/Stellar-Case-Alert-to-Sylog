name: Engineering System

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  governance-floor:
    if: github.event_name == 'pull_request_target'
    uses: datarelay-labs/engineering-system/.github/workflows/governance-floor.yml@2c73cdd52b98db4143b379730ee0c69d284f80e8
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  adoption-compliance:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/adoption-compliance.yml@2c73cdd52b98db4143b379730ee0c69d284f80e8

  enforcement-reconcile:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/enforcement-check.yml@2c73cdd52b98db4143b379730ee0c69d284f80e8

  affected-tests:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/affected-tests.yml@2c73cdd52b98db4143b379730ee0c69d284f80e8
    with:
      manifest_path: .engineering/tests.yaml
      trigger: pr
