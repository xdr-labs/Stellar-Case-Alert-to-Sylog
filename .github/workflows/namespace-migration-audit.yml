name: Temporary namespace migration audit

on:
  push:
    paths:
      - '.github/workflows/namespace-migration-audit.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace transferred GitHub namespace references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old = "Rick" + "Lee-kr"
          new = "xdr-labs"
          workflow = Path(".github/workflows/namespace-migration-audit.yml")
          changed = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path == workflow or not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              if old.encode() in data:
                  path.write_bytes(data.replace(old.encode(), new.encode()))
                  changed.append(str(path))
          print("NAMESPACE_FILES_CHANGED=%d" % len(changed))
          for path in changed:
              print("NAMESPACE_CHANGED_FILE=%s" % path)
          PY
          OLD_OWNER="Rick$(printf '%s' 'Lee-kr')"
          if git grep -nF "$OLD_OWNER" -- . ':!.github/workflows/namespace-migration-audit.yml'; then
            echo "NAMESPACE_AUDIT=FAIL stale references remain"
            exit 1
          fi
          while IFS= read -r file; do [ -z "$file" ] || bash -n "$file"; done < <(git diff --name-only -- '*.sh')
          while IFS= read -r file; do [ -z "$file" ] || python3 -m py_compile "$file"; done < <(git diff --name-only -- '*.py')
          echo "NAMESPACE_AUDIT=PASS"
      - name: Commit namespace updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "NAMESPACE_COMMIT=NOT_REQUIRED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: update transferred GitHub namespace"
          git push
          echo "NAMESPACE_COMMIT=PASS"
